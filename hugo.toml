baseURL = 'https://cybecho.github.io/'
languageCode = 'ko-kr'
title = '삽질 저장소'
theme = 'hugo-blog-awesome'

enableRobotsTXT = true
enableEmoji = true
enableGitInfo = true
canonifyURLs = true

# SEO 최적화
[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

# 🎯 Hugo v0.148+ 호환 페이지네이션 설정
mainSections = ["posts"]
[pagination]
  pagerSize = 50
  path = "page"

[params]
  # ⚠️ 스칼라 파라미터는 [params.author] 같은 하위 테이블보다 먼저 선언해야 한다.
  # TOML에서는 테이블 헤더 이후의 키가 그 하위 테이블에 속하므로,
  # 이전에는 title/subtitle/keywords/googleAnalytics/googleSiteVerification 등이
  # 전부 params.author 아래로 들어가 사이트 전체의 meta description이 비어 있었다.
  title = "삽질 저장소"
  subtitle = "본질에 몰입하는 엔지니어 입니다. HW 및 OS에 관심이 많습니다."

  # SEO 설정
  keywords = ["프로그래밍", "개발", "기술블로그", "Hugo", "GitHub", "엔지니어링"]

  # Google Analytics
  googleAnalytics = "G-3S7YFLEF06"

  # Google Search Console
  googleSiteVerification = "Qo0OxfN5ruMcndy9ZDJD0ldtj-8gqSZkhc_0C2bx6Po"

  postSectionName = "블로그"

  showToc = true
  TocOpen = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  UseHugoToc = true
  colorScheme = "light"

  [params.author]
    name = "Cybecho"
    avatar = "https://avatars.githubusercontent.com/u/42949995?v=4"
    bio = "기술과 문화를 사랑합니다"

  # 소셜 링크 (우측 프로필 위젯에 표시)
  [[params.social]]
    name = "GitHub"
    url = "https://github.com/Cybecho"
    icon = "github"

  [[params.social]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/cybecho/"
    icon = "linkedin"

  [[params.social]]
    name = "Brunch"
    url = "https://brunch.co.kr/@cybecho"
    icon = "brunch"

  [[params.social]]
    name = "Portfolio"
    url = "https://gamma.app/docs/Infra-75ni4cxerzurjak"
    icon = "portfolio"

  [[params.social]]
    name = "Reddit"
    url = "https://www.reddit.com/user/HelloZOOO/"
    icon = "reddit"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "블로그"
    url = "/"
    weight = 10
  [[menu.main]]
    identifier = "series"
    name = "시리즈"
    url = "/series/"
    weight = 20
  [[menu.main]]
    identifier = "tags"
    name = "태그"
    url = "/tags/"
    weight = 30
  [[menu.main]]
    identifier = "about"
    name = "소개"
    url = "/about/"
    weight = 40
  [[menu.main]]
    identifier = "archives"
    name = "아카이브"
    url = "/archives/"
    weight = 50

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions]
    linkify = true
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['$$', '$$'], ['\\[', '\\]']]
        inline = [['$', '$'], ['\\(', '\\)']]
  [markup.highlight]
    style = "github"
    lineNos = false
    lineNumbersInTable = false
    noClasses = false
    tabWidth = 2
    guessSyntax = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[taxonomies]
  series = 'series'
  tag = 'tags'

[build]
  writeStats = true
