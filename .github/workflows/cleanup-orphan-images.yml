      - name: Commit deletions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "nothing to delete" && exit 0
          git commit -m "chore: remove 150 orphan images (401MB) unreferenced by posts"
          git push
