name: Hugo with Direct Notion API

on:
  push:
    branches: ["main", "claude/*", "fix/*"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A failed or stale run must never replace a newer site. PRs do not block production.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pages: read
    outputs:
      source_sha: ${{ steps.persist.outputs.source_sha }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Last verified production build: Actions run 42788037284.
          hugo-version: '0.169.0'
          extended: true

      - name: Reject outdated production source
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
            echo '::error::Main changed since this run was queued. Refusing stale sync/deployment.'
            exit 1
          }

      - name: Notion to Hugo Sync
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          NOTION_SECRET: ${{ secrets.NOTION_SECRET }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
        run: npm run sync

      # External URL-title enrichment is deliberately outside the critical path.
      # Existing labels are valid links; arbitrary third-party fetches must not
      # hang publishing or rewrite unrelated content during a sync.
      - name: Stage content without changing source archives
        run: node scripts/prepare-build.js stage content "$RUNNER_TEMP/hugo-content"

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --buildFuture --contentDir "$RUNNER_TEMP/hugo-content" --cleanDestinationDir

      - name: Compact verified duplicate output assets
        run: |
          roots=(content layouts static themes hugo.toml)
          for optional in assets data config; do
            if [[ -d "$optional" ]]; then roots+=("$optional"); fi
          done
          node scripts/prepare-build.js compact public "${roots[@]}" | tee "$RUNNER_TEMP/asset-audit.json"

      - name: Validate Pages output
        run: |
          test -s public/index.html
          test -s public/index.xml
          test -s public/index.json
          test -s public/sitemap.xml
          bytes=$(du -sb public | cut -f1)
          echo "Pages output: $bytes bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/asset-audit.json" >> "$GITHUB_STEP_SUMMARY"
          if (( bytes >= 1000000000 )); then
            echo '::error::Pages output is at least 1 GB. Refusing oversized deployment; original assets are preserved.'
            exit 1
          fi

      - name: Persist only validated Notion changes
        id: persist
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
            echo '::error::Main changed during build. Refusing to rebase or deploy a stale artifact.'
            exit 1
          }
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -- content/posts .notion_cache_git.json
          if ! git diff --staged --quiet; then
            git commit -m "fix: persist validated Notion sync"
            # A normal fast-forward push rejects any concurrent source change.
            git push origin HEAD:main
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Verify artifact still matches main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current" = "$EXPECTED_SHA" || {
            echo '::error::Main changed after build. Refusing stale deployment.'
            exit 1
          }
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
